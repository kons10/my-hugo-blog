baseurl = "https://hugo.kto.f5.si"
DefaultContentLanguage = "ja"
title = "Kanon's memo"
theme = "material"
copyright = "© 2026 奏音（Kanon）"

[Params]
  author = "奏音（Kanon）"
  # Hugo の記事セクションは content/post（単数形）
  mainSections = ["post"]

[Params.giscus]
  enabled = true
  repo = "kons10/my-hugo-blog"
  repoId = "R_kgDOQ6vD7g"
  category = "giscus"
  categoryId = "DIC_kwDOQ6vD7s4DAUyo"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "preferred_color_scheme"
  lang = "ja"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    noClasses = true
    style = "monokai"
    tabWidth = 4

[Services]
  [Services.Disqus]
  [Services.googleAnalytics]

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 1
  [menu.main.params]
  icon = "label"

[[menu.main]]
  name = "About"
  url = "/page/about/"
  weight = 2  
  [menu.main.params]
  icon = "info"

[[Params.social]]
  name = "GitHub"
  url = "https://github.com/kons10"

[[Params.social]]
  name = "X"
  url = "https://x.com/k0ns10"

[[Params.social]]
